# fly.toml app configuration file generated for miyubottv on 2026-09-06T11:05:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'miyubottv'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
